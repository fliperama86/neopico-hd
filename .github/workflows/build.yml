name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  # Group by REF, not SHA: a tag push and a branch push at the same commit
  # must not cancel each other (this repeatedly cancelled tag release runs).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [mvs, snes]
    steps:
    # Byte-identity with the operator's reference environment: GCC embeds
    # __FILE__ (assert()/panic() strings) and DWARF compilation-unit paths
    # literally as the path passed to it on the command line, which CMake
    # derives from the source directories given to `cmake -S`/-DPICO_SDK_PATH.
    # Checking the repo and the SDK out at the SAME absolute paths used
    # locally (/Users/dudu/Projects/neogeo/neopico-hd, /Users/dudu/pico-sdk)
    # makes those embedded strings match exactly, rather than diverging on
    # /home/runner/... vs /Users/dudu/.... The clean alternative
    # (-ffile-prefix-map on both sides, normalizing to a neutral path) was
    # considered and deferred: it changes the bytes of the already
    # hardware-validated binary, which is the one thing this task must not do.
    # Real directories, not symlinks: chosen to avoid depending on whether
    # CMake/GCC resolve a symlinked source dir to its target before
    # embedding it -- that would need verifying per toolchain/CMake version;
    # a real directory at the exact path sidesteps the question entirely.
    - name: Prepare local-path mirror (byte-identical __FILE__/debug paths)
      run: |
        sudo mkdir -p /Users/dudu/Projects/neogeo/neopico-hd /Users/dudu/pico-sdk
        sudo chown -R "$(id -u):$(id -g)" /Users

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    # actions/checkout@v4 refuses a `path:` outside github.workspace
    # ("Repository path ... is not under ...", confirmed on this runner) --
    # it always checks out under github.workspace regardless. Relocate the
    # populated checkout afterward instead: copy rather than move, so
    # github.workspace still exists as a valid (if now-stale) directory for
    # any later step's default working-directory.
    - name: Relocate checkout to local-path mirror
      run: cp -a "$GITHUB_WORKSPACE"/. /Users/dudu/Projects/neogeo/neopico-hd/

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake

    # Pinned to the exact toolchain used for local hardware validation (Arm
    # GNU Toolchain 13.2.Rel1) instead of the distro gcc-arm-none-eabi
    # package. Ubuntu's build (15:13.2 Ubuntu package) produced a v0.11.0 CI
    # artifact that differed byte-for-byte from the tested binary. Installed
    # by direct download + SHA256 verification (rather than a third-party
    # action) so the exact bytes fetched are pinned and auditable in this
    # file, not delegated to whatever a moving action tag resolves to. The
    # official archive is self-contained (bundles its own newlib/libstdc++),
    # so the separate libnewlib-arm-none-eabi/libstdc++-arm-none-eabi-newlib
    # apt packages are no longer needed.
    - name: Install Arm GNU Toolchain (pinned 13.2.Rel1)
      run: |
        cd /tmp
        curl -fsSL -o arm-toolchain.tar.xz \
          https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb  arm-toolchain.tar.xz" | sha256sum -c -
        mkdir -p "$HOME/arm-gnu-toolchain-13.2.Rel1"
        tar -xf arm-toolchain.tar.xz -C "$HOME/arm-gnu-toolchain-13.2.Rel1" --strip-components=1
        echo "$HOME/arm-gnu-toolchain-13.2.Rel1/bin" >> "$GITHUB_PATH"

    # Pinned to the exact commit checked out in the operator's local
    # /Users/dudu/pico-sdk (the SDK used for hardware validation), not the
    # default branch's current tip: an unpinned `git clone --depth 1` drifts
    # over time (confirmed: it produced 2.3.0 in CI vs 2.2.1-develop
    # locally, the actual cause of a byte-mismatched release artifact).
    # `git submodule update --init` after checking out this exact commit
    # reproduces the same submodule SHAs as local (verified: the gitlinks
    # are baked into the SDK commit itself) -- btstack 501e6d2, cyw43-driver
    # dd75682, lwip 77dcd25, mbedtls 107ea89, tinyusb 86ad6e5.
    # Bump BOTH sides together (this pin AND /Users/dudu/pico-sdk locally),
    # with a hardware retest, when upgrading the SDK -- never one without
    # the other, or this byte-identity guarantee silently breaks again.
    - name: Setup Pico SDK
      run: |
        mkdir -p /Users/dudu/pico-sdk
        cd /Users/dudu/pico-sdk
        git init -q
        git remote add origin https://github.com/raspberrypi/pico-sdk.git
        git fetch --depth 1 origin a1e9cf05b21f114b27a762cb04da51ee2a9322bd
        git checkout FETCH_HEAD
        git submodule update --init

    # Single baseline firmware: the resolution selector. One build switches
    # between 240p / 480p / 720p from the reboot-based OSD menu. The live
    # Digital/Analog Colors menu is automatic on MVS builds whenever
    # NEOPICO_ENABLE_DARK_SHADOW is off (the default); SNES has no Colors menu
    # since it targets a different capture source.
    # 480p runs at 252 MHz and exact-clock 720p at 320 MHz, so COPY_TO_RAM auto-forces.

    - name: Run MVS color tests
      if: matrix.target == 'mvs'
      working-directory: /Users/dudu/Projects/neogeo/neopico-hd
      run: bash tests/run_mvs_color_exhaustive.sh

    - name: Build NeoPico-HD
      working-directory: /Users/dudu/Projects/neogeo/neopico-hd
      run: |
        cmake -S . -B build \
          -DPICO_SDK_PATH=/Users/dudu/pico-sdk \
          -DCMAKE_BUILD_TYPE=Release \
          -DNEOPICO_CAPTURE_TARGET=${{ matrix.target }}
        cmake --build build -j$(nproc)
        python3 scripts/audit_firmware.py build/src/neopico_hd.elf
        cp build/src/neopico_hd.uf2 neopico_hd_${{ matrix.target }}.uf2
        cp build/src/neopico_hd.elf neopico_hd_${{ matrix.target }}.elf

    # Absolute paths (not workspace-relative): the repo was checked out at
    # /Users/dudu/Projects/neogeo/neopico-hd, not github.workspace, for
    # __FILE__/debug-path byte-identity (see "Prepare local-path mirror"
    # above), and actions/upload-artifact resolves relative `path:` globs
    # against github.workspace, not a step's working-directory.
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: neopico-hd-${{ matrix.target }}-build
        path: |
          /Users/dudu/Projects/neogeo/neopico-hd/neopico_hd_${{ matrix.target }}.uf2
          /Users/dudu/Projects/neogeo/neopico-hd/neopico_hd_${{ matrix.target }}.elf

  fabrication:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board:
          - name: neopico-hd
            pcb: hardware/neopico-hd/neopico-hd.kicad_pcb
            sch: hardware/neopico-hd/neopico-hd.kicad_sch
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run KiBot
      uses: INTI-CMNB/KiBot@v2_k9
      with:
        config: hardware/kibot-jlcpcb.yml
        board: ${{ matrix.board.pcb }}
        schema: ${{ matrix.board.sch }}
        dir: output

    - name: Upload Fabrication Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.board.name }}-jlcpcb
        path: |
          output/gerbers.zip
          output/bom.csv
          output/pos.csv

  release:
    needs: [build, fabrication]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: 'neopico-hd-*-build'
        path: build-artifacts
        merge-multiple: true

    - name: Download Fabrication Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: '*-jlcpcb'
        path: fab-artifacts

    - name: Prepare Release Files
      run: |
        mkdir -p release-files
        find build-artifacts \( -name '*.uf2' -o -name '*.elf' \) | xargs -I{} cp {} release-files/
        for board in fab-artifacts/*/; do
          name=$(basename "$board")
          cd "$board"
          zip -r "../../release-files/${name}.zip" .
          cd -
        done

    - name: Determine release version
      id: version
      run: |
        echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
        echo "Using manual tag: ${{ github.ref_name }}"

    - name: Generate changelog
      run: |
        # Find the previous tag (second most recent, or empty if none)
        PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -2 | tail -1)
        CURRENT_TAG=$(git tag --sort=-v:refname | grep '^v' | head -1)
        if [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
          PREV_TAG=""
        fi
        if [ -n "$PREV_TAG" ]; then
          CHANGELOG=$(git log "${PREV_TAG}"..HEAD --pretty=format:"- %s (%h)")
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)")
        fi
        echo "$CHANGELOG" > /tmp/changelog.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.tag }}
        body_path: /tmp/changelog.txt
        files: release-files/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
